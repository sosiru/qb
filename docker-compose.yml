version: "3.9"

x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_DB: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

x-django-env: &django-env
  DJANGO_DEBUG: false
  DJANGO_SETTINGS_MODULE: qb.settings
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: postgres
  DB_USER: postgres
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  DB_HOST: qb_postgres
  DB_PORT: 5432
  PAYMENT_MICROSERVICE_URL: ${PAYMENT_MICROSERVICE_URL}
  PAYMENT_MICROSERVICE_API_KEY: ${PAYMENT_MICROSERVICE_API_KEY}
  PAYMENT_MICROSERVICE_SANDBOX: ${PAYMENT_MICROSERVICE_SANDBOX:-0}
  PAYMENT_MICROSERVICE_TIMEOUT_SECONDS: ${PAYMENT_MICROSERVICE_TIMEOUT_SECONDS:-30}
  PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL}
  PESAWAY_WEBHOOK_SECRET: ${PESAWAY_WEBHOOK_SECRET:-}
  PESAWAY_SYSTEM_SLUG: ${PESAWAY_SYSTEM_SLUG}
  PESAWAY_COLLECTION_EVENT_SLUG: ${PESAWAY_COLLECTION_EVENT_SLUG}
  PESAWAY_B2C_EVENT_SLUG: ${PESAWAY_B2C_EVENT_SLUG}
  PESAWAY_B2B_EVENT_SLUG: ${PESAWAY_B2B_EVENT_SLUG}
  PESAWAY_BANK_EVENT_SLUG: ${PESAWAY_BANK_EVENT_SLUG}
  NOTIFY: ${NOTIFY}
  NOTIFY_API_KEY: ${NOTIFY_API_KEY}
  NOTIFY_SYSTEM: ${NOTIFY_SYSTEM:-ratiba}
  NOTIFY_TIMEOUT_SECONDS: ${NOTIFY_TIMEOUT_SECONDS:-30}
  NOTIFY_LOW_WALLET_THRESHOLD_MINOR: ${NOTIFY_LOW_WALLET_THRESHOLD_MINOR:-0}

x-django-full-env: &django-full-env
  <<: [*django-env, *postgres-env]

x-app-image: &app-image ${IMAGE_TAG}

networks:
  backend:
    driver: bridge

volumes:
  qb_postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: qb_postgres
    restart: always
    environment:
      <<: *postgres-env
    volumes:
      - qb_postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  qb:
    image: *app-image
    container_name: qb_app
    environment:
      <<: *django-full-env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8012:8000"
    networks:
      - backend
    restart: always
