version: "3.9"

x-django-env: &django-env
  DJANGO_DEBUG: false
  DJANGO_SETTINGS_MODULE: qb.settings
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DB_ENGINE: django.db.backends.postgresql
  BACKGROUND_COMMANDS_ENABLED: ${BACKGROUND_COMMANDS_ENABLED:-1}
  QUICKBILLS_BACKGROUND_COMMANDS_ENABLED: ${QUICKBILLS_BACKGROUND_COMMANDS_ENABLED:-1}
  QUICKBILLS_FORCE_BACKGROUND_COMMANDS: ${QUICKBILLS_FORCE_BACKGROUND_COMMANDS:-1}
  PAYMENT_MICROSERVICE_URL: ${PAYMENT_MICROSERVICE_URL}
  PAYMENT_MICROSERVICE_API_KEY: ${PAYMENT_MICROSERVICE_API_KEY}
  PAYMENT_MICROSERVICE_SANDBOX: ${PAYMENT_MICROSERVICE_SANDBOX:-0}
  PAYMENT_MICROSERVICE_TIMEOUT_SECONDS: ${PAYMENT_MICROSERVICE_TIMEOUT_SECONDS:-30}
  PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL}
  PESAWAY_WEBHOOK_SECRET: ${PESAWAY_WEBHOOK_SECRET:-}
  PESAWAY_SYSTEM_SLUG: ${PESAWAY_SYSTEM_SLUG}
  PESAWAY_COLLECTION_EVENT_SLUG: ${PESAWAY_COLLECTION_EVENT_SLUG}
  PESAWAY_B2C_EVENT_SLUG: ${PESAWAY_B2C_EVENT_SLUG}
  PESAWAY_B2B_EVENT_SLUG: ${PESAWAY_B2B_EVENT_SLUG}
  PESAWAY_BANK_EVENT_SLUG: ${PESAWAY_BANK_EVENT_SLUG}
  NOTIFY: ${NOTIFY}
  NOTIFY_API_KEY: ${NOTIFY_API_KEY}
  NOTIFY_SYSTEM: ${NOTIFY_SYSTEM:-quickbills}
  NOTIFY_TIMEOUT_SECONDS: ${NOTIFY_TIMEOUT_SECONDS:-30}
  NOTIFY_LOW_WALLET_THRESHOLD_MINOR: ${NOTIFY_LOW_WALLET_THRESHOLD_MINOR:-0}
  NOTIFY_SMS_TEMPLATE: ${NOTIFY_SMS_TEMPLATE:-sms_default}
  NOTIFY_EMAIL_TEMPLATE: ${NOTIFY_EMAIL_TEMPLATE:-email_default}
  DB_NAME: ${DATABASE_DB}
  DB_USER: ${DATABASE_USER}
  DB_PASSWORD: ${DATABASE_PASSWORD}
  DB_HOST: ${DATABASE_HOST}
  DB_PORT: ${DATABASE_PORT}


x-app-image: &app-image ${IMAGE_TAG}

x-common-labels: &common-labels
  observability.app: qb
  observability.environment: ${SHARED_ENV}

networks:
  default:
    name: ${SHARED_NETWORK}
    external: true

services:
  qb:
    image: *app-image
    container_name: ${SHARED_ENV}_qb_app
    labels:
      <<: *common-labels
      observability.component: api
    environment:
      <<: *django-env
    ports:
      - "${API_PORT}:8000"
    restart: always
